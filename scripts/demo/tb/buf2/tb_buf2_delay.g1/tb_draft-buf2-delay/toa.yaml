type: tb
license: CC0-1.0
author: Gazettoa
ifc: ifc_draft-buf2
name: tb_buf2_delay
title: Delay of each stage, driving a fan-out of four
description: Watches the probe stage1, the output of the first inverter, to split the delay of the buffer between its two stages.
socket: buf2
probes: [stage1]
files:
  netlist:
  - tb.sp
simulators:
- {name: ngspice, version: '42'}
run: ngspice -b input.sp -r results/results.raw
analyze: {entry: analyze.py, python: '>=3.10', results: nutascii}
metrics:
- {id: tpd, unit: ps, better: lower, tolerance: {rel: 0.05}, description: Delay from the input rising to the output rising}
- {id: tpd1, unit: ps, better: lower, tolerance: {rel: 0.05}, description: Delay from the input rising to the probe stage1 falling}
parameters:
  vdd: {unit: V, description: Supply voltage}
presets:
  nom:
    parameters: {vdd: 1.8}
    options: {temp: 27}
    models:
    - {file: demo.lib, section: tt}
